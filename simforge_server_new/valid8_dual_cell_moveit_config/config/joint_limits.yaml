# Joint limits configuration for Valid8 Dual Cell
# Override default joint limits from URDF for safety
#
# These are the ABSOLUTE CEILING for joint velocities/accelerations.
# The MoveIt planning request scaling factors (max_velocity_scaling,
# max_acceleration_scaling — configurable as ROS params on the gateway
# node, default 0.2) multiply against these values.
#
# Effective speed = per-joint limit × scaling factor.
# Example: shoulder at 1.0 rad/s × 0.2 scaling = 0.2 rad/s (~11.5°/s)
#
# Hardware maximums for reference:
#   Shoulder/Elbow: 3.14 rad/s (180°/s)
#   Wrist: 6.28 rad/s (360°/s)
#
# Previous limits had asymmetric velocities: shoulder/elbow at 1.0 rad/s
# and wrist at 1.5 rad/s.  This caused TOTG to produce trajectories with
# different peak speeds per segment (0.2 vs 0.3 rad/s effective), leading
# to perceived speed variation and occasional protective stops from
# spline interpolation overshoot.
#
# Current limits: ALL joints at 1.0 rad/s velocity, 1.5 rad/s² accel.
# At scaling=0.2 → effective 0.200 rad/s, 0.300 rad/s² for all joints.
# This ensures uniform speed across all trajectory segments.
#
# Jerk limits are included for completeness (used if Ruckig is ever
# re-enabled).  Currently only TOPP is active.

# Global scaling (applied on top of per-joint limits).
# Keep at 1.0 — per-request scaling from the gateway controls speed.
default_velocity_scaling_factor: 1.0
default_acceleration_scaling_factor: 1.0

joint_limits:
  # Nakul UR5e joints
  # Effective velocity = max_velocity × scaling_factor (default 0.2)
  # ALL joints:    1.0 × 0.2 = 0.2 rad/s (~11.5°/s)  — uniform & safe
  # acceleration:  1.5 × 0.2 = 0.3 rad/s²            — gentle ramps
  nakul_shoulder_pan_joint:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.5
    has_jerk_limits: true
    max_jerk: 10.0
  nakul_shoulder_lift_joint:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.5
    has_jerk_limits: true
    max_jerk: 10.0
  nakul_elbow_joint:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.5
    has_jerk_limits: true
    max_jerk: 10.0
  nakul_wrist_1_joint:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.5
    has_jerk_limits: true
    max_jerk: 10.0
  nakul_wrist_2_joint:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.5
    has_jerk_limits: true
    max_jerk: 10.0
  nakul_wrist_3_joint:
    has_velocity_limits: true
