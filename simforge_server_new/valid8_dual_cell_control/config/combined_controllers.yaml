# Combined Controllers Configuration for Valid8 Dual Cell
#
# This file defines all ros2_control controllers for both robots:
# - nakul_ur5e (prefix: nakul_)
# - sahadev_ur5e (prefix: sahadev_)
#
# Based on Universal Robots ROS2 Dual Robot Tutorial

controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    # Joint State Broadcaster (shared for all robots)
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # ========== Nakul Controllers ==========
    nakul_io_and_status_controller:
      type: ur_controllers/GPIOController

    nakul_speed_scaling_state_broadcaster:
      type: ur_controllers/SpeedScalingStateBroadcaster

    nakul_force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    nakul_scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController

    nakul_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    nakul_forward_position_controller:
      type: position_controllers/JointGroupPositionController

    nakul_passthrough_trajectory_controller:
      type: ur_controllers/PassthroughTrajectoryController

    # ========== Sahadev Controllers ==========
    sahadev_io_and_status_controller:
      type: ur_controllers/GPIOController

    sahadev_speed_scaling_state_broadcaster:
      type: ur_controllers/SpeedScalingStateBroadcaster

    sahadev_force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    sahadev_scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController

    sahadev_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    sahadev_forward_position_controller:
      type: position_controllers/JointGroupPositionController

    sahadev_passthrough_trajectory_controller:
      type: ur_controllers/PassthroughTrajectoryController

# ========== Nakul Scaled Joint Trajectory Controller ==========
nakul_scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - nakul_shoulder_pan_joint
      - nakul_shoulder_lift_joint
      - nakul_elbow_joint
      - nakul_wrist_1_joint
      - nakul_wrist_2_joint
      - nakul_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: false
    interpolation_method: splines
    constraints:
      stopped_velocity_tolerance: 0.5
      goal_time: 2.0
    speed_scaling_interface_name: nakul_speed_scaling/speed_scaling_factor

# ========== Nakul Joint Trajectory Controller ==========
nakul_joint_trajectory_controller:
  ros__parameters:
    joints:
      - nakul_shoulder_pan_joint
      - nakul_shoulder_lift_joint
      - nakul_elbow_joint
      - nakul_wrist_1_joint
      - nakul_wrist_2_joint
      - nakul_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0

# ========== Nakul Forward Position Controller ==========
nakul_forward_position_controller:
  ros__parameters:
    joints:
      - nakul_shoulder_pan_joint
      - nakul_shoulder_lift_joint
      - nakul_elbow_joint
      - nakul_wrist_1_joint
      - nakul_wrist_2_joint
      - nakul_wrist_3_joint

# ========== Nakul IO and Status Controller ==========
nakul_io_and_status_controller:
  ros__parameters:
    tf_prefix: nakul_

# ========== Nakul Speed Scaling State Broadcaster ==========
nakul_speed_scaling_state_broadcaster:
  ros__parameters:
    state_publish_rate: 100.0
    tf_prefix: nakul_

# ========== Nakul Force Torque Sensor Broadcaster ==========
nakul_force_torque_sensor_broadcaster:
  ros__parameters:
    sensor_name: nakul_tcp_fts_sensor
    state_interface_names:
      - force.x
      - force.y
      - force.z
      - torque.x
      - torque.y
      - torque.z
    frame_id: nakul_tool0

