      - ROBOT_IP_SAHADEV_UR5E=${ROBOT_IP_SAHADEV_UR5E:-192.168.1.16}
      - ROBOT_IP_UR20=${ROBOT_IP_UR20:-0.0.0.0}
      # Legacy compat
