      - MAX_ACCELERATION_SCALING=${MAX_ACCELERATION_SCALING:-1.0}
      - INTERPOLATION_DT=${INTERPOLATION_DT:-0.02}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    network_mode: host
    privileged: true
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio:
        soft: 99
        hard: 99
      memlock:
        soft: 102400
        hard: 102400
    init: true
    stop_grace_period: 15s
    stdin_open: true
    tty: true
    command: /start_server.sh --real
    profiles:
      - prod

  # ── Jetson Thor Simulation Mode ────────────────────────────
  # JetPack 7 / aarch64, ros2_control mock hardware, cuRobo iGPU
  simforge-server-nvidia-jetson-sim:
