# ──────────────────────────────────────────────────────────────
# SimForge Server — NVIDIA cuRobo Backend
#
# GPU-accelerated motion planning with NVIDIA cuRobo.
# Real-robot trajectory streaming via ur_rtde (500 Hz servoJ).
# Simulated control via ros2_control (mock hardware).
#
# Ports (exposed via host networking):
#   9090  — Foxglove Bridge WebSocket
#   8766  — cuRobo Command Gateway WebSocket
#
# Environment selection:
#   ENV_CONFIG selects the robot environment:
#     valid8_dual_ur5e  — Dual UR5e cell (default)
#     face_robot_ur20   — Single UR20 with 8 face targets
#
#   Robot IPs via env vars:
#     ROBOT_IP_NAKUL_UR5E, ROBOT_IP_SAHADEV_UR5E  (dual UR5e)
#     ROBOT_IP_UR20                                 (single UR20)
#
# Platforms:
#   x86_64 (AMD/Intel + NVIDIA GPU):
#     Simulation:  docker compose --profile sim up
#     Production:  docker compose --profile prod up
#
#   Jetson Thor (JetPack 7, aarch64):
#     Simulation:  docker compose --profile jetson-sim up
#     Production:  docker compose --profile jetson-prod up
#
#   Face robot:  ENV_CONFIG=face_robot_ur20 docker compose --profile sim up
#
# GPU requirements:
#   x86_64:
#     - NVIDIA driver 535+ with CUDA 12.2 support
#     - NVIDIA Container Toolkit (nvidia-container-toolkit)
#   Jetson Thor:
#     - JetPack 7.0 with CUDA 13.x
#     - NVIDIA Container Toolkit (default-runtime: nvidia)
#     - Must build natively on device (no cross-compilation)
# ──────────────────────────────────────────────────────────────

services:
  # ── Simulation Mode ────────────────────────────────────────
  # ros2_control with mock hardware, cuRobo GPU planning
  simforge-server-nvidia-sim:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: simforge-server-nvidia-sim
    hostname: simforge-server-nvidia-sim
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ENV_CONFIG=${ENV_CONFIG:-valid8_dual_ur5e}
      # Robot IPs (used in real mode, harmless in sim)
      - ROBOT_IP_NAKUL_UR5E=${ROBOT_IP_NAKUL_UR5E:-192.168.1.9}
      - ROBOT_IP_SAHADEV_UR5E=${ROBOT_IP_SAHADEV_UR5E:-192.168.1.16}
      - ROBOT_IP_UR20=${ROBOT_IP_UR20:-0.0.0.0}
      # Legacy compat
      - NAKUL_ROBOT_IP=${NAKUL_ROBOT_IP:-192.168.1.9}
      - SAHADEV_ROBOT_IP=${SAHADEV_ROBOT_IP:-192.168.1.16}
      # Motion planning
      - MAX_VELOCITY_SCALING=${MAX_VELOCITY_SCALING:-1.0}
      - MAX_ACCELERATION_SCALING=${MAX_ACCELERATION_SCALING:-1.0}
      - INTERPOLATION_DT=${INTERPOLATION_DT:-0.02}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    network_mode: host
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Real-time scheduling for RTDE 500 Hz loop
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio:
        soft: 99
        hard: 99
      memlock:
        soft: 102400
        hard: 102400
    init: true
    stop_grace_period: 15s
    stdin_open: true
    tty: true
    command: /start_server.sh --sim
    profiles:
      - sim

  # ── Real Robot Mode ────────────────────────────────────────
  # ur_rtde direct control (500 Hz servoJ), cuRobo GPU planning
  simforge-server-nvidia:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: simforge-server-nvidia
    hostname: simforge-server-nvidia
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ENV_CONFIG=${ENV_CONFIG:-valid8_dual_ur5e}
      # Robot IPs
      - ROBOT_IP_NAKUL_UR5E=${ROBOT_IP_NAKUL_UR5E:-192.168.1.9}
      - ROBOT_IP_SAHADEV_UR5E=${ROBOT_IP_SAHADEV_UR5E:-192.168.1.16}
      - ROBOT_IP_UR20=${ROBOT_IP_UR20:-0.0.0.0}
      # Legacy compat
