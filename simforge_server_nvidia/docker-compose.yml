    init: true
    stop_grace_period: 15s
    stdin_open: true
    tty: true
    command: /start_server.sh --sim
    profiles:
      - jetson-sim

  # ── Jetson Thor Real Robot Mode ────────────────────────────
  # JetPack 7 / aarch64, ur_rtde direct control, cuRobo iGPU
  simforge-server-nvidia-jetson:
    build:
      context: .
