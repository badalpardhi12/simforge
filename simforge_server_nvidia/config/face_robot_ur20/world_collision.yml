# ──────────────────────────────────────────────────────────────
# cuRobo World Configuration: Face Robot UR20
#
# Single UR20 at world origin with 8 face targets in a circle.
# No optical table — robot is floor-mounted.
#
# Face targets at 1.2m radius, z=1.0m, spaced 45° apart.
# Each face approximated as a 0.20m cube for collision.
#
# Pose format: [x, y, z, qw, qx, qy, qz]
# ──────────────────────────────────────────────────────────────
cuboid:
  # Shop floor — ground plane
  shop_floor:
    dims: [5.0, 5.0, 0.1]
    pose: [0.0, 0.0, -0.05, 1, 0, 0, 0]

  # Face 0: 0° → (1.2, 0, 1.0), yaw=90°
  face_0:
    dims: [0.20, 0.20, 0.20]
    pose: [1.2, 0.0, 1.0, 0.7071, 0, 0, 0.7071]

  # Face 1: 45° → (0.849, 0.849, 1.0), yaw=135°
  face_1:
    dims: [0.20, 0.20, 0.20]
    pose: [0.849, 0.849, 1.0, 0.3827, 0, 0, 0.9239]

  # Face 2: 90° → (0, 1.2, 1.0), yaw=180°
  face_2:
    dims: [0.20, 0.20, 0.20]
    pose: [0.0, 1.2, 1.0, 0, 0, 0, 1]

  # Face 3: 135° → (-0.849, 0.849, 1.0), yaw=225°
  face_3:
    dims: [0.20, 0.20, 0.20]
    pose: [-0.849, 0.849, 1.0, -0.3827, 0, 0, 0.9239]

  # Face 4: 180° → (-1.2, 0, 1.0), yaw=270°
  face_4:
    dims: [0.20, 0.20, 0.20]
    pose: [-1.2, 0.0, 1.0, -0.7071, 0, 0, 0.7071]

  # Face 5: 225° → (-0.849, -0.849, 1.0), yaw=315°
  face_5:
    dims: [0.20, 0.20, 0.20]
    pose: [-0.849, -0.849, 1.0, -0.9239, 0, 0, 0.3827]

  # Face 6: 270° → (0, -1.2, 1.0), yaw=0°
  face_6:
    dims: [0.20, 0.20, 0.20]
    pose: [0.0, -1.2, 1.0, 1, 0, 0, 0]

  # Face 7: 315° → (0.849, -0.849, 1.0), yaw=45°
  face_7:
    dims: [0.20, 0.20, 0.20]
    pose: [0.849, -0.849, 1.0, 0.9239, 0, 0, 0.3827]
