# Valid8 Cell Default Configuration
#
# This file contains default parameters for the Valid8 workcell.
# Override these in your launch files or through ROS parameters.

# Positions are relative to world frame
valid8_cell:
  # Optical table configuration
  optical_table:
    position: [0.0, 0.0, 1.0]  # x, y, z in meters
    orientation: [0.0, 0.0, 0.0]  # roll, pitch, yaw in radians
    scale: [1.4, 1.37, 1.17]  # x, y, z scale factors for mesh
    
  # Face fixture configuration
  face:
    position: [0.1742, 0.0, 1.6]  # x, y, z in meters
    orientation: [0.0, 0.0, 1.5708]  # roll, pitch, yaw (90° yaw)
    
  # Robot mount configuration
  robot_mount:
    position: [-0.6758, 0.0, 1.03]  # x, y, z in meters
    orientation: [0.0, 0.0, -1.5708]  # roll, pitch, yaw (-90° yaw)

# Default robot parameters
robot:
  type: ur5e
  tf_prefix: ""  # Use "ur5e_" for multi-robot setups
