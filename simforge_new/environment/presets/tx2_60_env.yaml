version: 2
metadata:
  name: tx2_60_cell
  description: Single TX2-60 arm workspace for basic motion tests.
scene:
  dt: 0.005
  backend: gpu
  viewer:
    enabled: true
    max_fps: 60
world:
  objects:
    - type: plane
      name: shop_floor
      pose_position: [0.0, 0.0, 0.0]
    - type: box
      name: table1
      size: [1.2, 0.8, 0.76]
      pose_position: [-1.0, 0.0, 0.38]
      pose_orientation_rpy: [0.0, 0.0, 0.0]
robots:
  - name: TX2_60_1
    urdf: ../../assets/tx2_60/tx2_60.urdf
    end_effector_link: link_6
    base_pose:
      position: [0.0, 0.0, 0.0]
      orientation_rpy: [0.0, 0.0, 0.0]
    fixed_base: true
    initial_joint_positions_deg: [0.0, -60.0, 90.0, 0.0, 60.0, 0.0]
    control:
      mode: cartesian
      limits:
        cartesian_velocity: 0.1
      planner_strategy: cartesian_preferred
      ground_clearance_m: 0.04
policies:
  safety:
    workspace_min: [-2.0, -2.0, 0.0]
    workspace_max: [2.0, 2.0, 2.0]
    minimum_clearance_m: 0.01
  logging:
    level: INFO
