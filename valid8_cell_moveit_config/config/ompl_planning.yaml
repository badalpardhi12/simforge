# OMPL Planning Configuration for Valid8 Cell
#
# This file configures the OMPL (Open Motion Planning Library) planners
# for the UR arm planning group.
#
# Reference: https://moveit.picknik.ai/main/doc/examples/ompl_interface/ompl_interface_tutorial.html

planning_plugins:
  - ompl_interface/OMPLPlanner

# Request adapters (pre/post processing of planning requests)
request_adapters:
  - default_planning_request_adapters/ResolveConstraintFrames
  - default_planning_request_adapters/ValidateWorkspaceBounds
  - default_planning_request_adapters/CheckStartStateBounds
  - default_planning_request_adapters/CheckStartStateCollision

# Response adapters
response_adapters:
  - default_planning_response_adapters/AddTimeOptimalParameterization
  - default_planning_response_adapters/ValidateSolution

# OMPL planner configurations
planner_configs:
  # Default planners
  RRTConnect:
    type: geometric::RRTConnect
    range: 0.0  # Max distance between states (0 = auto)
    
  RRTstar:
    type: geometric::RRTstar
    range: 0.0
    goal_bias: 0.05
    delay_collision_checking: true
    
  PRM:
    type: geometric::PRM
    max_nearest_neighbors: 10
    
  PRMstar:
    type: geometric::PRMstar
    
  LazyPRMstar:
    type: geometric::LazyPRMstar
    
  TRRT:
    type: geometric::TRRT
    range: 0.0
    goal_bias: 0.05
    
  BiTRRT:
    type: geometric::BiTRRT
    range: 0.0
    
  EST:
    type: geometric::EST
    range: 0.0
    goal_bias: 0.05
    
  KPIECE:
    type: geometric::KPIECE
    range: 0.0
    goal_bias: 0.05
    border_fraction: 0.9
    
  BKPIECE:
    type: geometric::BKPIECE
    range: 0.0
    border_fraction: 0.9
    
  LBKPIECE:
    type: geometric::LBKPIECE
    range: 0.0
    border_fraction: 0.9

# Planning group configuration
ur_manipulator:
  # Default planner for this group
  default_planner_config: RRTConnect
  
  # Available planners for this group
  planner_configs:
    - RRTConnect
    - RRTstar
    - PRM
    - PRMstar
    - LazyPRMstar
    - TRRT
    - BiTRRT
    - EST
    - KPIECE
    - BKPIECE
    - LBKPIECE
    
  # Projection evaluator (for KPIECE-based planners)
  projection_evaluator: joints(shoulder_pan_joint,shoulder_lift_joint)
  
  # Longest valid segment fraction
  longest_valid_segment_fraction: 0.005
