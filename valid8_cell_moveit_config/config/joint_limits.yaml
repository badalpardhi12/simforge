# Joint Limits Configuration for Valid8 Cell
#
# This file defines joint limits for motion planning including:
# - Position limits (already in URDF)
# - Velocity limits
# - Acceleration limits (IMPORTANT: MoveIt requires these!)
#
# The acceleration limits are crucial for the UR Robot Driver's
# scaled_joint_trajectory_controller. Without them, trajectory
# execution will fail.
#
# Reference: https://docs.universal-robots.com/Universal_Robots_ROS_Documentation/doc/ur_tutorials/my_robot_cell/doc/build_moveit_config.html

# Default velocity and acceleration scaling factors
# These are applied to ALL planned trajectories and can be overridden per-request
# IMPORTANT: Keep these conservative! The UR5e's hardware max velocities are very high
# (3.14 rad/s shoulder, 6.28 rad/s wrist) but external control via ROS2 should use
# much lower limits to avoid velocity-limit protective stops on the teach pendant.
# The actual commanded velocity = max_velocity × scaling_factor.
default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

# Joint limits for UR5e
# Note: These are PLANNING limits, NOT the hardware maximums.
# The UR5e hardware maximums are 3.14 rad/s (shoulder/elbow) and 6.28 rad/s (wrist),
# but using those values causes velocity-limit protective stops when the robot controller
# applies its own safety checks. We use ~30% of hardware max as our planning ceiling.
# Combined with velocity_scaling_factor (0.1-0.5), actual velocities will be safe.
#
# The max_acceleration is also reduced from 5.0 to 2.5 rad/s^2 to avoid jerky motion
# and acceleration-triggered protective stops.
joint_limits:
  shoulder_pan_joint:
    has_velocity_limits: true
    max_velocity: 1.0  # rad/s (~32% of 3.14 hardware max)
    has_acceleration_limits: true
    max_acceleration: 2.5  # rad/s^2 (reduced from 5.0)
    
  shoulder_lift_joint:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 2.5
    
  elbow_joint:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 2.5
    
  wrist_1_joint:
    has_velocity_limits: true
    max_velocity: 1.5  # rad/s (~24% of 6.28 hardware max)
    has_acceleration_limits: true
    max_acceleration: 2.5
    
  wrist_2_joint:
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 2.5
    
  wrist_3_joint:
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 2.5
