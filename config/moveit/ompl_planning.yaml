# OMPL Motion Planner Configuration
# 
# This configures the OMPL (Open Motion Planning Library) planners
# for the UR5e robot via MoveIt 2.

planning_plugin: ompl_interface/OMPLPlanner
request_adapters: >-
  default_planner_request_adapters/ResolveConstraintFrames
  default_planner_request_adapters/ValidateWorkspaceBounds
  default_planner_request_adapters/CheckStartStateBounds
  default_planner_request_adapters/CheckStartStateCollision

start_state_max_bounds_error: 0.1

planner_configs:
  RRTConnect:
    type: geometric::RRTConnect
    range: 0.0  # Max distance between states (0 = auto)
  
  RRT:
    type: geometric::RRT
    range: 0.0
    goal_bias: 0.05
  
  RRTstar:
    type: geometric::RRTstar
    range: 0.0
    goal_bias: 0.05
    delay_collision_checking: true
  
  PRM:
    type: geometric::PRM
    max_nearest_neighbors: 10
  
  LBKPIECE:
    type: geometric::LBKPIECE
    range: 0.0
    border_fraction: 0.9
    
  BiTRRT:
    type: geometric::BiTRRT
    range: 0.0
    temp_change_factor: 0.1
    init_temp: 100
    frontier_threshold: 0.0
    frontier_node_ratio: 0.1

ur_manipulator:
  # Default planner for the arm
  default_planner_config: RRTConnect
  
  # Planning time limits
  longest_valid_segment_fraction: 0.01
  projection_evaluator: joints(shoulder_pan_joint,shoulder_lift_joint)
  
  # Planner-specific configs
  planner_configs:
    - RRTConnect
    - RRTstar
    - BiTRRT
    - LBKPIECE
