# Kinematics solver configuration for UR5e
# Uses KDL (Kinematics and Dynamics Library) solver

ur_manipulator:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  
  # KDL specific options
  position_only_ik: false
  
  # Additional IK solver options
  # If trac_ik is available, it provides better success rates:
  # kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  # solve_type: Distance  # Speed, Distance, or Manipulation1
