# cuMotion Configuration for UR5e
# This file configures the NVIDIA cuMotion motion planner for the UR5e robot
# Used for GPU-accelerated motion planning with nvblox ESDF integration

planner_plugin: isaac_ros_cumotion/CumotionMoveItPlugin

isaac_ros_cumotion:
  # Robot configuration
  robot_file: "ur5e.xrdf"
  urdf_path: "/ros2_ws/src/simforge/assets/ur5e/ur5e.urdf"
  
  # Robot kinematics
  base_link: "base_link"
  tip_link: "tool0"
  
  # ==========================================================================
  # Planning Parameters
  # ==========================================================================
  
  # Time dilation - slows down motion for safety
  # 0.5 = half speed, 1.0 = full speed
  time_dilation_factor: 0.5
  
  # Enable global graph-based planner
  # Provides roadmap for complex motions
  enable_graph_planner: true
  
  # Enable trajectory optimization
  # Smooths and optimizes paths
  enable_trajopt: true
  
  # Planning timeout (seconds)
  planning_timeout: 5.0
  
  # Number of planning attempts
  num_planning_attempts: 3
  
  # ==========================================================================
  # Collision Parameters
  # ==========================================================================
  
  # Voxel size for collision checking (meters)
  # Smaller = more accurate but slower
  collision_check_voxel_size: 0.02
  
  # Cost weight for collision proximity
  # Higher = more conservative paths
  collision_cost_weight: 100.0
  
  # Minimum clearance from obstacles (meters)
  min_clearance: 0.03
  
  # Self-collision checking
  self_collision_check: true
  
  # ==========================================================================
  # nvblox Integration
  # ==========================================================================
  
  # Use nvblox ESDF for obstacle avoidance
  use_nvblox_costmap: true
  
  # Topic for ESDF distance map (combined from multiple sensors)
  nvblox_costmap_topic: "/nvblox/combined_esdf"
  
  # Alternative: use single depth camera ESDF
  # nvblox_costmap_topic: "/nvblox/esdf"
  
  # Timeout waiting for costmap update (seconds)
  costmap_update_timeout: 0.1
  
  # ==========================================================================
  # UR5e Joint Limits
  # ==========================================================================
  
  # Joint names
  joint_names:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  
  # Position limits (radians)
  joint_position_limits:
    shoulder_pan_joint: [-6.2831, 6.2831]
    shoulder_lift_joint: [-6.2831, 6.2831]
    elbow_joint: [-3.1416, 3.1416]
    wrist_1_joint: [-6.2831, 6.2831]
    wrist_2_joint: [-6.2831, 6.2831]
    wrist_3_joint: [-6.2831, 6.2831]
  
  # ==========================================================================
  # Trajectory Parameters
  # ==========================================================================
  
  # Maximum joint velocity (rad/s) - UR5e limits
  max_joint_velocity: 3.14
  
  # Maximum joint acceleration (rad/s^2)
  max_joint_acceleration: 2.0
  
  # Trajectory time parameterization
  velocity_scaling_factor: 0.3
  acceleration_scaling_factor: 0.3
  
  # Path tolerance (radians)
  joint_path_tolerance: 0.01
  
  # Goal tolerance (radians)
  joint_goal_tolerance: 0.001
  
  # ==========================================================================
  # GPU Configuration
  # ==========================================================================
  
  # CUDA stream for planning
  cuda_stream: "default"
  
  # Number of parallel collision checks
  num_collision_threads: 4
  
  # IK configuration
  ik:
    num_seeds: 20
    max_iterations: 100
    tolerance: 1e-5
