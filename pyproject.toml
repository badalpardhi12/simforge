[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simforge_new"
version = "0.1.0"
description = "Genesis-powered robot simulator with joint and Cartesian control"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "simforge_new Team"}]
license = {text = "Proprietary"}
dependencies = [
  "genesis-world>=0.3.3",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "pydantic>=2.0",
  "xxhash",
  "pin",
  "python-fcl>=0.7",
  "trimesh>=3.0",
  "ompl>=1.6",
  "wxpython>=4.1",
  "drake",
  "torch"
]

[project.urls]
Homepage = "https://example.com/simforge_new"

[project.scripts]
simforge_new = "simforge_new:main"

[project.optional-dependencies]
planning = ["ompl>=1.6"]
qt = ["PySide6>=6.6"]
gui = ["wxpython>=4.1"]
drake = ["drake>=1.0"]
dev = ["pytest>=7.0", "ruff>=0.5.0"]

[tool.setuptools.packages.find]
include = ["simforge_new*"]
