# env_configs/all_robots.yaml
scene:
  show_viewer: true
  dt: 0.01
  max_fps: 120
  backend: gpu

objects:
  - type: "plane"
    position: [0, 0, 0]
    size: [5, 5, 0.01]
  - type: "box"
    name: table1
    position: [-1.5, 0.0, 0.38]
    orientation_rpy: [0, 0, 0]
    size: [1.2, 0.8, 0.76]
  - type: "sphere"
    name: ref_sphere
    position: [0.4, 0.0, 0.3]
    size: [0.05, 0.05, 0.05]
    collision_enabled: true
    dynamic: false

# Defaults applied to every robot unless overridden below
defaults:
  control:
    world_allowed_pairs:
      - ["link_6", "obj:table1"]                 # TX2_60_1 EE link (prefix stripped in code)
      - ["wrist_3_link", "obj:table1"]           # UR5e_1 wrist 3
      - ["meca_axis_6_link", "obj:table1"]      # MECA500 axis 6 link (matches end_effector_link)
    collision_mesh_shrink: 1.0

robots:
  # You can inline a robot OR include an existing robot yaml and override fields.
  # - name: TX2_60_1
  #   urdf: "assets/tx2_60/tx2_60.urdf"
  - name: TX2_90XL_1
    urdf: "assets/tx2_90xl/tx2_90xl.urdf"
    pose: {position: [0.0, 0.0, 0.0], rpy: [0, 0, 0]}
    fixed_base: true
    initial_joint_positions: [0, -60, 90, 0, 60, 0]  # degrees (safer elbow-up-ish)
    end_effector_link: link_6
    tool:
      urdf: "assets/tools/simple_tool.urdf"
      position: [0, 0, 0]
      orientation_rpy: [0, 0, 0]
    control:
      cartesian_speed_limit: 0.1
      default_tcp: [0, 0, 0, 1, 0, 0, 0]
      collision_check: true
      self_collision_check: true  # Re-enable with conservative adjacent pairs
      ground_plane_z: 0.0
      ik_pos_tolerance_m: 1e-3
      ik_rot_tolerance_deg: 1.0

  # - name: UR5e_1
  #   urdf: "assets/ur5e/ur5e.urdf"
  - name: UR20_1
    urdf: "assets/ur20/ur20.urdf"
    pose: {position: [0.8, 0.8, 0.0], rpy: [0, 0, 0]}
    fixed_base: true
    initial_joint_positions: [0, -90, 0, -90, 0, 0]  # degrees
    end_effector_link: wrist_3_link
    tool:
      urdf: "assets/tools/simple_tool.urdf"
      position: [0, 0, 0]
      orientation_rpy: [0, 0, 0]
    control:
      cartesian_speed_limit: 0.1
      default_tcp: [0, 0, 0, 1, 0, 0, 0]
      collision_check: true
      self_collision_check: true  # Re-enable with conservative adjacent pairs
      ground_plane_z: 0.0
      ik_pos_tolerance_m: 1e-3
      ik_rot_tolerance_deg: 1.0

  - name: MECA500_1
    urdf: "assets/meca500/meca.urdf"
    pose: {position: [0.8, -0.8, 0.0], rpy: [0, 0, 0]}
    fixed_base: true
    initial_joint_positions: [0, 0, 0, 0, 0, 0]  # degrees (safe reach pose)
    end_effector_link: meca_axis_6_link
    tool:
      urdf: "assets/tools/simple_tool.urdf"
      position: [0.0, 0, 0]
      orientation_rpy: [0, 1.57, 0]
    control:
      cartesian_speed_limit: 0.1
      default_tcp: [0, 0, 0, 1, 0, 0, 0]
      collision_check: true
      self_collision_check: true  # Re-enable with conservative adjacent pairs
      ground_plane_z: 0.0
      collision_mesh_shrink: 0.85
      ik_pos_tolerance_m: 1e-3
      ik_rot_tolerance_deg: 1.0
