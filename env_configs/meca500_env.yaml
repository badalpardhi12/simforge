# env_configs/meca500_env.yaml
scene:
  show_viewer: true
  dt: 0.01
  max_fps: 120
  backend: gpu

objects:
  - type: "plane"
    position: [0, 0, 0]
    size: [5, 5, 0.01]
  - type: "box"
    name: table1
    position: [-1.5, 0.0, 0.38]
    orientation_rpy: [0, 0, 0]
    size: [1.2, 0.8, 0.76]
  - type: "sphere"
    name: ref_sphere
    position: [0.4, 0.0, 0.3]
    size: [0.05, 0.05, 0.05]
    collision_enabled: true
    dynamic: false

# Defaults applied to every robot unless overridden below
defaults:
  control:
    world_allowed_pairs:
      - ["meca_axis_6_link", "obj:table1"]      # MECA500 axis 6 link (matches end_effector_link)
    collision_mesh_shrink: 1.0

robots:

  - name: MECA500_1
    urdf: "assets/meca500/meca.urdf"
    pose: {position: [0.8, -0.8, 0.0], rpy: [0, 0, 0]}
    fixed_base: true
    initial_joint_positions: [0, 0, 0, 0, 0, 0]  # degrees (safe reach pose)
    end_effector_link: meca_axis_6_link
    tool:
      urdf: "assets/tools/simple_tool.urdf"
      position: [0.0, 0, 0]
      orientation_rpy: [0, 1.57, 0]
    control:
      cartesian_speed_limit: 0.1
      default_tcp: [0, 0, 0, 1, 0, 0, 0]
      collision_check: true
      self_collision_check: true  # Re-enable with conservative adjacent pairs
      ground_plane_z: 0.0
      collision_mesh_shrink: 0.85
      ik_pos_tolerance_m: 1e-3
      ik_rot_tolerance_deg: 1.0
