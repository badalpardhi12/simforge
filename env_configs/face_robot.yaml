scene:
  show_viewer: true
  dt: 0.01
  max_fps: 120
  backend: gpu

objects:
  - type: "plane"
    position: [0, 0, 0]
    size: [5, 5, 0.01]
  - type: "urdf"
    name: "face_object_0"
    urdf: "assets/non_pii_face/non_pii_face.urdf"
    position: [1.000, 0.000, 1.0]
    orientation_rpy: [0, 0, 90]
    dynamic: false
    collision_enabled: true
  - type: "urdf"
    name: "face_object_1"
    urdf: "assets/non_pii_face/non_pii_face.urdf"
    position: [0.707, 0.707, 1.0]
    orientation_rpy: [0, 0, 135]
    dynamic: false
    collision_enabled: true
  - type: "urdf"
    name: "face_object_2"
    urdf: "assets/non_pii_face/non_pii_face.urdf"
    position: [0.000, 1.000, 1.0]
    orientation_rpy: [0, 0, 180]
    dynamic: false
    collision_enabled: true
  - type: "urdf"
    name: "face_object_3"
    urdf: "assets/non_pii_face/non_pii_face.urdf"
    position: [-0.707, 0.707, 1.0]
    orientation_rpy: [0, 0, 225]
    dynamic: false
    collision_enabled: true
  - type: "urdf"
    name: "face_object_4"
    urdf: "assets/non_pii_face/non_pii_face.urdf"
    position: [-1.000, 0.000, 1.0]
    orientation_rpy: [0, 0, 270]
    dynamic: false
    collision_enabled: true
  - type: "urdf"
    name: "face_object_5"
    urdf: "assets/non_pii_face/non_pii_face.urdf"
    position: [-0.707, -0.707, 1.0]
    orientation_rpy: [0, 0, 315]
    dynamic: false
    collision_enabled: true
  - type: "urdf"
    name: "face_object_6"
    urdf: "assets/non_pii_face/non_pii_face.urdf"
    position: [0.000, -1.000, 1.0]
    orientation_rpy: [0, 0, 0]
    dynamic: false
    collision_enabled: true
  - type: "urdf"
    name: "face_object_7"
    urdf: "assets/non_pii_face/non_pii_face.urdf"
    position: [0.707, -0.707, 1.0]
    orientation_rpy: [0, 0, 45]
    dynamic: false
    collision_enabled: true

robots:
  - name: TX2_90XL_1
    urdf: "assets/tx2_90xl/tx2_90xl.urdf"
    pose: {position: [0.0, 0.0, 0.0], rpy: [0, 0, 0]}
    fixed_base: true
    initial_joint_positions: [0, -60, 90, 0, 60, 0]
    end_effector_link: link_6
    tool:
      urdf: "assets/tools/simple_tool.urdf"
      position: [0, 0, 0]
      orientation_rpy: [0, 0, 0]
    control:
      cartesian_speed_limit: 0.1
      default_tcp: [0, 0, 0, 1, 0, 0, 0]
      collision_check: true
      self_collision_check: true
      ground_plane_z: 0.0
      ik_pos_tolerance_m: 1e-3
      ik_rot_tolerance_deg: 1.0