# Simforge Server v2 - Docker Compose Configuration
#
# Simplified architecture using ROS2 + MoveIt2 + UR Robot Driver
#
# Usage:
#   Development (mock hardware - simulation only):
#     docker compose -f docker-compose-v2.yml --profile dev up
#
#   Production (real robot only):
#     ROBOT_IP=192.168.1.9 docker compose -f docker-compose-v2.yml --profile prod up
#
#   Hybrid (real robot with dynamic mode switching - RECOMMENDED):
#     ROBOT_IP=192.168.1.9 docker compose -f docker-compose-v2.yml --profile hybrid up
#     
#     In hybrid mode, you can switch between simulation/real/both modes
#     at runtime from the client GUI without restarting the container.
#
# Environment Variables:
#   ROBOT_IP        - IP address of the UR robot (default: 192.168.1.9)
#   UR_TYPE         - Robot model (default: ur5e)
#   USE_MOCK        - Use simulated hardware (default: true for dev, false for prod/hybrid)
#   REVERSE_IP      - IP for robot to connect back (default: 192.168.1.12)
#   CLIENT_IP       - Client machine IP (reference only: 192.168.1.31)

services:
  # =============================================================================
  # ROS 2 Server (Development - Mock Hardware)
  # =============================================================================
  ros2_server_dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.server.x86
    image: simforge_server:v2-dev
    container_name: simforge_v2_dev
    profiles:
      - dev
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      # Robot configuration - Mock hardware for development
      - ROBOT_IP=${ROBOT_IP:-192.168.1.9}
      - UR_TYPE=${UR_TYPE:-ur5e}
      - USE_MOCK_HARDWARE=true
      - REVERSE_IP=${REVERSE_IP:-192.168.1.12}
    volumes:
      # Mount source for hot-reload development
      - ./valid8_cell_description:/ros2_ws/src/valid8_cell_description
      - ./valid8_cell_control:/ros2_ws/src/valid8_cell_control:ro
      - ./valid8_cell_moveit_config:/ros2_ws/src/valid8_cell_moveit_config
      - ./simforge_server_v2:/ros2_ws/src/simforge_server_v2:ro
      # Mount to installed locations
      - ./valid8_cell_description/urdf:/ros2_ws/install/valid8_cell_description/share/valid8_cell_description/urdf
      - ./valid8_cell_description/meshes:/ros2_ws/install/valid8_cell_description/share/valid8_cell_description/meshes:ro
      - ./valid8_cell_moveit_config/config:/ros2_ws/install/valid8_cell_moveit_config/share/valid8_cell_moveit_config/config
      - ./docker/ros_entrypoint.sh:/ros_entrypoint.sh:ro
    privileged: true
    network_mode: host
    stdin_open: true
    tty: true
    command: >
      bash -c "
        source /ros2_ws/install/setup.bash &&
        python3 /ros2_ws/src/simforge_server_v2/scripts/startup.py --mock &&
        ros2 launch valid8_cell_control full_stack.launch.py robot_ip:=$${ROBOT_IP:-192.168.1.9} ur_type:=$${UR_TYPE:-ur5e} use_mock_hardware:=true launch_foxglove:=true launch_moveit:=true launch_command_gateway:=true reverse_ip:=$${REVERSE_IP:-192.168.1.12}
      "
    healthcheck:
      test: ["CMD", "ros2", "topic", "list"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =============================================================================
  # NOTE: Foxglove is now integrated into the main server container
  # The separate container was causing DDS discovery issues
  # =============================================================================

  # =============================================================================
  # ROS 2 Server (Production - Real Robot)
  # =============================================================================
  ros2_server_prod:
    build:
      context: .
      dockerfile: docker/Dockerfile.server.x86
    image: simforge_server:v2-prod
    container_name: simforge_v2_prod
    profiles:
      - prod
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      # Robot configuration - Real hardware
      - ROBOT_IP=${ROBOT_IP:-192.168.1.9}
      - UR_TYPE=${UR_TYPE:-ur5e}
      - USE_MOCK_HARDWARE=false
      - REVERSE_IP=${REVERSE_IP:-192.168.1.12}
    volumes:
      - ./valid8_cell_description:/ros2_ws/src/valid8_cell_description
      - ./valid8_cell_control:/ros2_ws/src/valid8_cell_control:ro
      - ./valid8_cell_moveit_config:/ros2_ws/src/valid8_cell_moveit_config
      - ./simforge_server_v2:/ros2_ws/src/simforge_server_v2:ro
      - ./valid8_cell_description/urdf:/ros2_ws/install/valid8_cell_description/share/valid8_cell_description/urdf
      - ./valid8_cell_description/meshes:/ros2_ws/install/valid8_cell_description/share/valid8_cell_description/meshes:ro
      - ./valid8_cell_moveit_config/config:/ros2_ws/install/valid8_cell_moveit_config/share/valid8_cell_moveit_config/config
      - ./docker/ros_entrypoint.sh:/ros_entrypoint.sh:ro
    privileged: true
    network_mode: host
    stdin_open: true
    tty: true
    command: >
      bash -c "
        source /ros2_ws/install/setup.bash &&
        python3 /ros2_ws/src/simforge_server_v2/scripts/startup.py --ur-type $${UR_TYPE:-ur5e} --robot-ip $${ROBOT_IP:-192.168.1.9} --reverse-ip $${REVERSE_IP:-192.168.1.12} &&
        ros2 launch valid8_cell_control full_stack.launch.py robot_ip:=$${ROBOT_IP:-192.168.1.9} ur_type:=$${UR_TYPE:-ur5e} use_mock_hardware:=false launch_foxglove:=true launch_moveit:=true launch_command_gateway:=true reverse_ip:=$${REVERSE_IP:-192.168.1.12}
      "
    healthcheck:
      test: ["CMD", "ros2", "topic", "list"]
      interval: 10s
      timeout: 5s
      retries: 3


  # =============================================================================
  # ROS 2 Server (Hybrid - Real Robot with Dynamic Mode Switching)
  # =============================================================================
  # This profile connects to the real robot but allows switching between
  # simulation, real, and both modes at runtime from the client GUI.
  #
  # Usage:
  #   ROBOT_IP=192.168.1.9 docker compose -f docker-compose-v2.yml --profile hybrid up
  #
  # Mode switching is handled in software (command_gateway_node):
  #   - "simulation": Only updates visualization (safe testing)
  #   - "real": Sends trajectories to real robot only
  #   - "both": Real robot + synchronized visualization
  # =============================================================================
  ros2_server_hybrid:
    build:
      context: .
      dockerfile: docker/Dockerfile.server.x86
    image: simforge_server:v2-hybrid
    container_name: simforge_v2_hybrid
    profiles:
      - hybrid
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      # Robot configuration - Real hardware with dynamic mode switching
      - ROBOT_IP=${ROBOT_IP:-192.168.1.9}
      - UR_TYPE=${UR_TYPE:-ur5e}
      - USE_MOCK_HARDWARE=false
      - REVERSE_IP=${REVERSE_IP:-192.168.1.12}
      # Hybrid mode flag - allows graceful fallback if robot unavailable
      - HYBRID_MODE=true
    volumes:
      - ./valid8_cell_description:/ros2_ws/src/valid8_cell_description
      - ./valid8_cell_control:/ros2_ws/src/valid8_cell_control:ro
      - ./valid8_cell_moveit_config:/ros2_ws/src/valid8_cell_moveit_config
      - ./simforge_server_v2:/ros2_ws/src/simforge_server_v2:ro
      - ./valid8_cell_description/urdf:/ros2_ws/install/valid8_cell_description/share/valid8_cell_description/urdf
      - ./valid8_cell_description/meshes:/ros2_ws/install/valid8_cell_description/share/valid8_cell_description/meshes:ro
      - ./valid8_cell_moveit_config/config:/ros2_ws/install/valid8_cell_moveit_config/share/valid8_cell_moveit_config/config
      - ./docker/ros_entrypoint.sh:/ros_entrypoint.sh:ro
    privileged: true
    network_mode: host
    stdin_open: true
    tty: true
    command: >
      bash -c "
        source /ros2_ws/install/setup.bash &&
        echo '=======================================' &&
        echo 'HYBRID MODE: Real robot + dynamic mode switching' &&
        echo 'Switch between simulation/real/both from client GUI' &&
        echo '=======================================' &&
        python3 /ros2_ws/src/simforge_server_v2/scripts/startup.py --ur-type $${UR_TYPE:-ur5e} --robot-ip $${ROBOT_IP:-192.168.1.9} --reverse-ip $${REVERSE_IP:-192.168.1.12} &&
        ros2 launch valid8_cell_control full_stack.launch.py robot_ip:=$${ROBOT_IP:-192.168.1.9} ur_type:=$${UR_TYPE:-ur5e} use_mock_hardware:=false launch_foxglove:=true launch_moveit:=true launch_command_gateway:=true reverse_ip:=$${REVERSE_IP:-192.168.1.12}
      "
    healthcheck:
      test: ["CMD", "ros2", "topic", "list"]
      interval: 10s
      timeout: 5s
      retries: 3


networks:
  simforge_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
