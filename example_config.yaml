version: 2

scene:
  dt: 0.005
  backend: cpu
  gravity: [0, 0, -9.81]
  viewer:
    enabled: true

robots:
  - name: ur5e_demo
    urdf: "assets/ur5e/ur5e.urdf"
    end_effector_link: "wrist_3_link"
    base_pose:
      position: [0, 0, 0]
      orientation_rpy: [0, 0, 0]
    control:
      mode: joint
      limits:
        joint_velocity: 1.5
        joint_acceleration: 3.5
    initial_joint_positions_deg: [0, -90, 90, -90, -90, 0]

world:
  objects:
    - type: plane
      name: ground
      size: [5, 5, 0.1]
      pose_position: [0, 0, -0.05]
      pose_orientation_rpy: [0, 0, 0]

policies:
  ground_clearance_m: 0.04
  planner_timeouts_s:
    cartesian: 1.0
    joint: 3.0
