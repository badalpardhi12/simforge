# Kinematics Calibration for Valid8 UR5e Robot
#
# This file contains the factory calibration data for the specific UR5e robot
# used in the Valid8 cell. This data corrects for manufacturing tolerances
# and ensures accurate kinematic calculations.
#
# IMPORTANT: This should be extracted from your real robot using:
#   ros2 launch ur_calibration calibration_correction.launch.py \
#     robot_ip:=<robot_ip> target_filename:=<path_to_this_file>
#
# The default values below are from ur_description and may not be accurate
# for your specific robot. For best accuracy, always extract calibration
# from the real robot.
#
# Reference: https://docs.universal-robots.com/Universal_Robots_ROS_Documentation/doc/ur_robot_driver/ur_robot_driver/doc/installation/robot_setup.html#extract-calibration-information

kinematics:
  # DH parameters for UR5e (default values)
  # These values should be replaced with robot-specific calibration
  shoulder:
    x: 0.0
    y: 0.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
  upper_arm:
    x: 0.0
    y: 0.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
  forearm:
    x: 0.0
    y: 0.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
  wrist_1:
    x: 0.0
    y: 0.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
  wrist_2:
    x: 0.0
    y: 0.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
  wrist_3:
    x: 0.0
    y: 0.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
